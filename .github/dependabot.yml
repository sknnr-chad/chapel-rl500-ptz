version: 2

updates:
  # Python runtime dependencies declared in pyproject.toml.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    groups:
      # Bundle minor + patch bumps into one PR per ecosystem to cut noise.
      # Major bumps still get their own PR so the breaking-change review
      # is forced.
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # NOTE: no github-actions block yet — Dependabot errors with
  # "dependency_file_not_found" if the ecosystem is configured but no
  # workflows exist. Add a block here in the same PR that introduces the
  # first .github/workflows/*.yml file.
