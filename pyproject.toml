[project]
name = "pew-ptz"
version = "1.0.0"
description = "Phone-based PTZ camera controller with one-tap Zoom mute/video toggles. Drives any VISCA-over-IP PTZ; reads ground-truth Zoom state via Windows UI Automation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "flask>=3.1.3,<4",
    "pynput>=1.8.1,<2",
    "uiautomation>=2.0.18,<3 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["ruff>=0.7"]

[project.scripts]
pew-ptz = "pew_ptz.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pew_ptz"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
